[package]
name = "nem-monitor"
version = "0.1.0"
edition = "2021"
description = "Always-on NEM event detector: polls AEMO NEMWeb, detects price events, fires triggers and publishes public feeds"
license = "Apache-2.0"
repository = "https://github.com/nem-lens/monitor"

[dependencies]
anyhow = "1"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
# Shared NEMWeb parsers. The path matches the NEM Lens checkout layout
# (monitor/ and aemo/ side by side); CI checks both repos out the same way.
nem-lens-aemo = { path = "../aemo" }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
