# nem-monitor configuration. Every value shown is the default unless noted.

max_concurrent_triggers = 2

[server]
bind = "127.0.0.1:8080"                 # keep on localhost; Caddy terminates TLS in front
public_url = "https://nem.example.org"  # CHANGE: used in feeds and notification links
trust_proxy_headers = true              # NOT the default (false): true only behind your own reverse proxy

[source]
base_url = "https://nemweb.com.au/Reports/Current"
dispatch_dir = "DispatchIS_Reports"
poll_secs = 60
backfill_hours = 6
user_agent = "nem-monitor/0.1 (+https://nem.example.org; ops@example.org)"  # CHANGE: identify yourself to AEMO
data_ready_poll_secs = 600
data_ready_dirs = ["Next_Day_Dispatch", "Next_Day_Offer_Energy_SPARSE"]

[store]
path = "/var/lib/nem-monitor/nem-monitor.db"  # NOT the default (nem-monitor.db in the working directory)
buffer_hours = 48                 # rolling buffer of outcomes and raw zips; events keep theirs in bundles
raw_dir = "raw"                   # relative to the working directory
bundle_dir = "bundles"            # bundles/<event_id>/*.parquet + manifest.json
# mmsdm_dir = "/data/mmsdm"       # optional: <dir>/<YYYY_MM>/<TABLE>/*.CSV; adds constraint equations at data_ready

[detect]
regions = ["NSW1", "QLD1", "VIC1", "SA1", "TAS1"]
market_price_cap = 23200.0        # AEMC MPC for 1 Jul 2026 to 30 Jun 2027; update each July
high_price = 5000.0
extreme_price = 10000.0
cap_fraction = 0.95
confirm_intervals = 3
confirm_immediately_price = 15000.0
close_price = 1000.0
quiet_intervals = 6
floor_price = -900.0
whiplash_step = 1000.0
whiplash_reversals = 3
whiplash_window = 12
separation_price = 5000.0
demand_ramp_mw = 1500.0
demand_ramp_window = 12

[public]
site_title = "NEM Event Monitor"
min_severity = "high"             # high | extreme | cap
include_low_price = true
ntfy_server = "https://ntfy.sh"
ntfy_topic = ""                   # e.g. "nem-events-yourname"; empty disables push
webhooks_enabled = true          # false: webhook routes return 404 and the page hides the form
max_webhooks = 1000
allow_http_webhooks = false
webhook_registrations_per_ip_per_hour = 5
webhook_disable_after_failures = 10
feed_items = 50
max_sse_connections = 200         # live-stream clients; more get 503
api_requests_per_ip_per_minute = 120   # API and feeds, per client IP; 0 disables

# Operator triggers run the rest of the pipeline. Commands run without a shell;
# the notification JSON arrives on stdin and as NEM_* environment variables.

# Replay with every scenario and publish to the event library once bids are
# public (~04:15 next day); see deploy/publish-event.sh.
[[triggers]]
name = "publish"
on = ["data_ready"]
command = ["/opt/nem-lens/publish-event.sh", "{bundle}"]
timeout_secs = 3600

# Or hand off to a job queue instead of running locally.
# [[triggers]]
# name = "queue"
# on = ["confirmed", "closed", "data_ready"]
# webhook = "http://127.0.0.1:9000/jobs"
# secret_env = "NEM_TRIGGER_SECRET"
